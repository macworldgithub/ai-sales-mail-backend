server_tokens off;
client_max_body_size 2m;
client_body_timeout 15s;
send_timeout 300s;

access_log /var/log/nginx/ai-sales-mail-backend.access.log ai_sales_mail;
error_log /var/log/nginx/ai-sales-mail-backend.error.log warn;

location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
}

location / {
    proxy_pass http://ai_sales_mail_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite client-supplied forwarded addresses. Express trusts only loopback.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_cache off;
}
