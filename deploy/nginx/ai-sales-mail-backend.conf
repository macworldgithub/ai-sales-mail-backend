# Installed by deploy.sh in /etc/nginx/sites-available/ai-sales-mail-backend.
# This HTTP configuration also supports initial certificate issuance.
log_format ai_sales_mail '$time_iso8601 $remote_addr "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent $request_time $upstream_response_time';

upstream ai_sales_mail_backend {
    server 127.0.0.1:5921;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai-sales-backend.omnisuiteai.com www.ai-sales-backend.omnisuiteai.com;

    include /etc/nginx/snippets/ai-sales-mail-backend.conf;
}
