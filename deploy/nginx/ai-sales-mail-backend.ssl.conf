# Used automatically by deploy.sh when this certificate and key already exist.
log_format ai_sales_mail '$time_iso8601 $remote_addr "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent $request_time $upstream_response_time';

upstream ai_sales_mail_backend {
    server 127.0.0.1:5921;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai-sales-backend.omnisuiteai.com www.ai-sales-backend.omnisuiteai.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ai-sales-backend.omnisuiteai.com www.ai-sales-backend.omnisuiteai.com;

    ssl_certificate /etc/letsencrypt/live/ai-sales-backend.omnisuiteai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-sales-backend.omnisuiteai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ai_sales_mail_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/ai-sales-mail-backend.conf;
}
